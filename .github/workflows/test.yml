name: test

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used in this workflow; pull requests from forks get none anyway.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck watchdog.sh tests/test_watchdog.sh
      - name: watchdog logic tests
        run: bash tests/test_watchdog.sh
